input {
  file {
    path => "/var/log/nginx/nginx_access.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => {
      "message" => "%{COMBINEDAPACHELOG}"
    }
  }

  mutate {
    add_field => {
      "service" => "nginx"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-access-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
